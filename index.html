
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Fahad</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #09090f;
    color: white;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 40px;
    background: #141320;
    border: 1px solid #33244b;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    margin-bottom: 20px;
}

.logo span {
    color: #a76aff;
}

h1 {
    text-align: center;
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #9994a8;
    font-size: 13px;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 14px;
    background: #0d0c15;
    border: 1px solid #373044;
    border-radius: 8px;
    color: white;
    outline: none;
    font-size: 13px;
}

input:focus {
    border-color: #a76aff;
    box-shadow: 0 0 0 3px rgba(167,106,255,.1);
}

input::placeholder {
    color: #777181;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #bd91ff;
    border: none;
    background: none;
    cursor: pointer;
}

.terms {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 20px 0;
    color: #aaa4b6;
    font-size: 12px;
}

.terms input {
    width: 15px;
    height: 15px;
    accent-color: #a76aff;
}

button.submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(120deg,#a76aff,#7436d0);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button.submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(151,85,255,.3);
}

#message {
    text-align: center;
    font-size: 12px;
    margin: 12px 0;
}

.success {
    color: #65db9a;
}

.error {
    color: #ff7777;
}

.login {
    text-align: center;
    color: #9994a8;
    font-size: 12px;
    margin-top: 24px;
}

.login a {
    color: #bd91ff;
    text-decoration: none;
}

.footer {
    text-align: center;
    color: #716b80;
    font-size: 10px;
    margin-top: 25px;
}

@media(max-width: 450px) {
    .container {
        padding: 28px 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">F<span>.</span></div>

    <h1>Create Account</h1>
    <p class="subtitle">Join us and start your journey today.</p>

    <form id="signupForm">

        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name"
            placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email"
            placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password"
                placeholder="Create a password"
                minlength="8" required>
                <button type="button" class="toggle"
                onclick="togglePassword('password',this)">Show</button>
            </div>
        </div>

        <div class="input-group">
            <label for="confirm">Confirm Password</label>
            <div class="password-box">
                <input type="password" id="confirm"
                placeholder="Confirm your password" required>
                <button type="button" class="toggle"
                onclick="togglePassword('confirm',this)">Show</button>
            </div>
        </div>

        <label class="terms">
            <input type="checkbox" id="terms" required>
            I agree to the Terms & Conditions
        </label>

        <p id="message" aria-live="polite"></p>

        <button type="submit" class="submit">
            Create Account →
        </button>

    </form>

    <p class="login">
        Already have an account?
        <a href="#">Login</a>
    </p>

    <div class="footer">
        Made with ♥ by Fahad
    </div>

</div>

<script>
function togglePassword(id, button) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
    } else {
        input.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("signupForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const message = document.getElementById("message");

    if (name.length < 2) {
        showMessage("Please enter your full name.", "error");
        return;
    }

    if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.", "error");
        return;
    }

    if (password !== confirm) {
        showMessage("Passwords do not match!", "error");
        return;
    }

    showMessage(
        "Form validated successfully! Connect a backend to register your account.",
        "success"
    );

    this.reset();
});

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.className = type;
}
</script>

</body>
</html>
